name: sumeru

services:
  sumeru:
    image: sumeru-runtime:local
    build:
      context: ..
      dockerfile: Dockerfile.runtime
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    container_name: sumeru
    ports:
      - "127.0.0.1:${SUMERU_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SUMERU_NOVNC_PORT:-6901}:6901"
    volumes:
      - sumeru-data:/data
    environment:
      SUMERU_SCREEN: ${SUMERU_SCREEN:-1280x800x24}
      SUMERU_IME: ${SUMERU_IME:-}
      SUMERU_KEEP_LAST_TAB: ${SUMERU_KEEP_LAST_TAB:-1}
      SUMERU_API_KEY: ${SUMERU_API_KEY:-}
    shm_size: "1gb"
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  sumeru-data:
