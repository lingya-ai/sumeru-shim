name: release-image

# Tag vX.Y.Z -> build and push sumeru-runtime to Docker Hub.
# Manual run -> build only by default; set "push" to publish.
#
# Required secrets/vars:
#   DOCKERHUB_USERNAME    Docker Hub user/org
#   DOCKERHUB_TOKEN       Docker Hub access token (write scope)
#   KERNEL_ARTIFACT_URL   URL to the kernel tar.gz (build/ contents)
#   KERNEL_ARTIFACT_SHA256 optional; falls back to build-info.artifact.sha256
#   vars.DOCKERHUB_REPOSITORY optional, default "sumeru-runtime"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to Docker Hub"
        type: boolean
        default: false
      version:
        description: "Version to build (default: package.json)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'sumeru-runtime' }}
      KERNEL_ARTIFACT_URL: ${{ secrets.KERNEL_ARTIFACT_URL || vars.KERNEL_ARTIFACT_URL }}
      KERNEL_ARTIFACT_SHA256: ${{ secrets.KERNEL_ARTIFACT_SHA256 || vars.KERNEL_ARTIFACT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/version.mjs --tag "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            node scripts/version.mjs --version "${{ github.event.inputs.version }}" | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"
          else
            node scripts/version.mjs | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"
          fi
          echo "kernel_commit=$(node -p "require('./build-info.json').kernelCommit || 'unknown'")" >> "${GITHUB_OUTPUT}"
          echo "chromium_version=$(node -p "require('./build-info.json').chromiumVersion || 'unknown'")" >> "${GITHUB_OUTPUT}"

      - name: Prepare kernel artifact
        run: |
          set -euo pipefail
          if [ -z "${KERNEL_ARTIFACT_URL}" ]; then
            echo "::error::KERNEL_ARTIFACT_URL is not set. Add the secret/variable pointing to the kernel tar.gz."
            exit 1
          fi
          mkdir -p build
          curl -fL --retry 3 --retry-delay 5 "${KERNEL_ARTIFACT_URL}" -o /tmp/sumeru-kernel.tar.gz
          EXPECTED="${KERNEL_ARTIFACT_SHA256:-$(node -p "require('./build-info.json').artifact?.sha256 || ''")}"
          if [ -z "${EXPECTED}" ]; then
            echo "::error::No KERNEL_ARTIFACT_SHA256 and build-info.artifact.sha256 is empty."
            exit 1
          fi
          echo "${EXPECTED}  /tmp/sumeru-kernel.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sumeru-kernel.tar.gz -C build
          node scripts/setup.mjs --check
          if [ ! -f build/LICENSES.chromium.html ]; then
            echo "::error::build/LICENSES.chromium.html is missing; refusing to publish a Chromium binary without upstream notices."
            exit 1
          fi

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test
          npm run ci

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_stable == 'true' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            io.sumeru.kernel.commit=${{ steps.version.outputs.kernel_commit }}
            io.sumeru.chromium.version=${{ steps.version.outputs.chromium_version }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            KERNEL_COMMIT=${{ steps.version.outputs.kernel_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          echo "### Sumeru image" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- channel: ${{ steps.version.outputs.is_stable == 'true' && 'stable' || 'prerelease' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- kernel: ${{ steps.version.outputs.chromium_version }} / ${{ steps.version.outputs.kernel_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"