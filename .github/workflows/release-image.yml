name: release-image

# Tag vX.Y.Z -> build and push sumeru-runtime to Docker Hub.
# Manual run -> build only by default; set "push" to publish.
#
# Kernel source: private OCI image at registry.ops.lingya.tech
# Required secrets:
#   KERNEL_REGISTRY_USERNAME / KERNEL_REGISTRY_PASSWORD (pull kernel)
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (push runtime)
# Optional variables:
#   KERNEL_REGISTRY, KERNEL_IMAGE, DOCKERHUB_REPOSITORY
#
# The kernel image must already be published to the private registry by the
# local `chromium/scripts/publish-kernel.sh --push` workflow. GitHub never
# builds Chromium here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to Docker Hub"
        type: boolean
        default: false
      version:
        description: "Version to build (default: package.json)"
        type: string
        required: false
      kernel_tag:
        description: "Kernel tag (default: build-info.kernelTag)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'sumeru-runtime' }}
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY || 'registry.ops.lingya.tech' }}
      KERNEL_IMAGE: ${{ vars.KERNEL_IMAGE || 'registry.ops.lingya.tech/sumeru/sumeru-kernel' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            node scripts/version.mjs --tag "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            node scripts/version.mjs --version "${{ github.event.inputs.version }}" | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"
          else
            node scripts/version.mjs | tr '[:upper:]' '[:lower:]' >> "${GITHUB_OUTPUT}"
          fi
          KERNEL_TAG="${{ github.event.inputs.kernel_tag }}"
          if [ -z "${KERNEL_TAG}" ]; then
            KERNEL_TAG="$(node -p "require('./build-info.json').kernelTag || (require('./build-info.json').chromiumVersion + '-' + require('./build-info.json').kernelCommit)")"
          fi
          echo "kernel_tag=${KERNEL_TAG}" >> "${GITHUB_OUTPUT}"
          echo "kernel_commit=$(node -p "require('./build-info.json').kernelCommit || 'unknown'")" >> "${GITHUB_OUTPUT}"
          echo "chromium_version=$(node -p "require('./build-info.json').chromiumVersion || 'unknown'")" >> "${GITHUB_OUTPUT}"

      - name: Login to kernel registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.KERNEL_REGISTRY }}
          username: ${{ secrets.KERNEL_REGISTRY_USERNAME }}
          password: ${{ secrets.KERNEL_REGISTRY_PASSWORD }}

      - name: Pull kernel image
        run: |
          set -euo pipefail
          IMAGE="${KERNEL_IMAGE}:${{ steps.version.outputs.kernel_tag }}"
          docker pull "${IMAGE}"
          CID="$(docker create "${IMAGE}" /bin/true)"
          rm -rf build
          mkdir -p build
          docker cp "${CID}:/opt/sumeru/." build/
          docker rm "${CID}"
          test -x build/chrome
          if [ ! -f build/LICENSES.chromium.html ]; then
            echo "::error::kernel image is missing LICENSES.chromium.html; refusing to publish."
            exit 1
          fi
          LABEL_SHA="$(docker inspect --format '{{ index .Config.Labels "io.sumeru.chrome.sha256" }}' "${IMAGE}")"
          FILE_SHA="$(sha256sum build/chrome | cut -d' ' -f1)"
          if [ -z "${LABEL_SHA}" ] || [ "${LABEL_SHA}" != "${FILE_SHA}" ]; then
            echo "::error::kernel image chrome SHA label (${LABEL_SHA}) does not match extracted file (${FILE_SHA})."
            exit 1
          fi
          EXPECTED_SHA="$(node -p "require('./build-info.json').chromeSha256 || ''")"
          if [ -n "${EXPECTED_SHA}" ] && [ "${EXPECTED_SHA}" != "${FILE_SHA}" ]; then
            echo "::error::build-info.chromeSha256 (${EXPECTED_SHA}) does not match kernel image (${FILE_SHA})."
            exit 1
          fi

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test
          npm run ci

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_stable == 'true' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            io.sumeru.kernel.image=${{ env.KERNEL_IMAGE }}
            io.sumeru.kernel.tag=${{ steps.version.outputs.kernel_tag }}
            io.sumeru.kernel.commit=${{ steps.version.outputs.kernel_commit }}
            io.sumeru.chromium.version=${{ steps.version.outputs.chromium_version }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            KERNEL_COMMIT=${{ steps.version.outputs.kernel_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          echo "### Sumeru image" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- channel: ${{ steps.version.outputs.is_stable == 'true' && 'stable' || 'prerelease' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- kernel: ${{ env.KERNEL_IMAGE }}:${{ steps.version.outputs.kernel_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- kernel commit: ${{ steps.version.outputs.kernel_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"