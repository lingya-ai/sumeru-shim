name: kernel-build

# Build Chromium + overlay and publish an immutable kernel artifact image.
# Requires a self-hosted Linux runner with:
#   labels: self-hosted, linux, x64, sumeru-kernel
#   Docker
#   a Chromium 156.0.8078.74 source tree at /src (with .git, buildtools/linux64/gn,
#   third_party/ninja/ninja, and the ability to fetch clang/sysroot on first build)
#
# Image: registry.ops.lingya.tech/sumeru/sumeru-kernel:<chromium>-<revision>

on:
  workflow_dispatch:
    inputs:
      chromium_version:
        description: "Chromium version (default: build-info.chromiumVersion)"
        type: string
        required: false
      kernel_revision:
        description: "Kernel revision (default: build-info.kernelCommit)"
        type: string
        required: false
      push:
        description: "Push the kernel image to the registry"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-build
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: [self-hosted, linux, x64, sumeru-kernel]
    timeout-minutes: 720
    env:
      KERNEL_REGISTRY: ${{ vars.KERNEL_REGISTRY || 'registry.ops.lingya.tech' }}
      KERNEL_IMAGE: ${{ vars.KERNEL_IMAGE || 'registry.ops.lingya.tech/sumeru/sumeru-kernel' }}
      SUMERU_SRC: /src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve versions
        id: version
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="${{ github.event.inputs.chromium_version }}"
          KERNEL_REVISION="${{ github.event.inputs.kernel_revision }}"
          if [ -z "${CHROMIUM_VERSION}" ]; then
            CHROMIUM_VERSION="$(node -p "require('./build-info.json').chromiumVersion")"
          fi
          if [ -z "${KERNEL_REVISION}" ]; then
            KERNEL_REVISION="$(node -p "require('./build-info.json').kernelCommit")"
          fi
          TAG="${CHROMIUM_VERSION}-${KERNEL_REVISION}"
          echo "chromium_version=${CHROMIUM_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "kernel_revision=${KERNEL_REVISION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check Chromium source
        run: |
          set -euo pipefail
          test -f /src/DEPS || { echo "::error::/src is not a Chromium source tree (missing DEPS)"; exit 1; }
          test -x /src/buildtools/linux64/gn || { echo "::error::/src/buildtools/linux64/gn missing"; exit 1; }
          test -x /src/third_party/ninja/ninja || { echo "::error::/src/third_party/ninja/ninja missing"; exit 1; }
          git -C /src rev-parse --is-inside-work-tree >/dev/null

      - name: Build Chromium
        run: |
          set -euo pipefail
          docker build -f chromium/Dockerfile.kernel -t sumeru-kernel-build chromium
          docker run --rm -v /src:/src -e SUMERU_SRC=/src sumeru-kernel-build

      - name: Package kernel
        run: |
          set -euo pipefail
          mkdir -p dist build
          SUMERU_SRC=/src \
          SUMERU_VERSION="${{ steps.version.outputs.chromium_version }}" \
          SUMERU_COMMIT="${{ steps.version.outputs.kernel_revision }}" \
            bash chromium/scripts/package-kernel.sh dist
          tar -xzf dist/sumeru-kernel-*.tar.gz -C build
          test -x build/chrome
          if [ ! -f build/LICENSES.chromium.html ]; then
            echo "::error::build/LICENSES.chromium.html is missing; refusing to build a distributable kernel image."
            exit 1
          fi

      - name: Build kernel artifact image
        id: image
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          CHROME_SHA="$(sha256sum build/chrome | cut -d' ' -f1)"
          OVERLAY_SHA="$(sha256sum chromium/overlay/current.patch | cut -d' ' -f1)"
          docker build -f chromium/Dockerfile.kernel-artifact \
            --build-arg VERSION="${TAG}" \
            --build-arg CHROMIUM_VERSION="${{ steps.version.outputs.chromium_version }}" \
            --build-arg KERNEL_REVISION="${{ steps.version.outputs.kernel_revision }}" \
            --build-arg CHROME_SHA256="${CHROME_SHA}" \
            --build-arg OVERLAY_SHA256="${OVERLAY_SHA}" \
            -t "${KERNEL_IMAGE}:${TAG}" \
            build
          echo "chrome_sha=${CHROME_SHA}" >> "${GITHUB_OUTPUT}"
          echo "overlay_sha=${OVERLAY_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Login to kernel registry
        if: github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.KERNEL_REGISTRY }}
          username: ${{ secrets.KERNEL_REGISTRY_USERNAME }}
          password: ${{ secrets.KERNEL_REGISTRY_PASSWORD }}

      - name: Push kernel image
        if: github.event.inputs.push == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          docker push "${KERNEL_IMAGE}:${TAG}"
          echo "### Kernel image" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: ${KERNEL_IMAGE}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- chrome sha256: ${{ steps.image.outputs.chrome_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- overlay sha256: ${{ steps.image.outputs.overlay_sha }}" >> "$GITHUB_STEP_SUMMARY"